name: Build and deploy academic site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run lint:prettier
      - name: Derive GitHub Pages URL
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ruby -ryaml -e 'repo = ENV.fetch("REPOSITORY").split("/").last; owner = ENV.fetch("OWNER"); base = repo.downcase == "#{owner.downcase}.github.io" ? "" : "/#{repo}"; File.write("_config.deploy.yml", {"url" => "https://#{owner.downcase}.github.io", "baseurl" => base}.to_yaml)'
      - name: Audit and build
        env:
          JEKYLL_ENV: production
        run: |
          python3 scripts/check_publication.py --source
          bundle exec al-folio upgrade audit --no-fail
          bundle exec al-folio upgrade overrides audit
          bundle exec jekyll build --config _config.yml,_config.deploy.yml --trace
          python3 scripts/check_site.py _site
          python3 scripts/check_publication.py --site _site
      - name: Upload built preview
        uses: actions/upload-artifact@v4
        with:
          name: academic-site-preview
          path: _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Publication authorized by the owner; pushes to main update the live site.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
